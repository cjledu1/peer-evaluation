<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동료 평가</title>
<style>
  :root {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --border: #e0e3f0;
    --accent: #5b7fff;
    --accent-dim: rgba(91,127,255,0.1);
    --text: #1a1d2e;
    --muted: #6b7394;
    --danger: #e03c3c;
    --success: #28a85a;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 2px 16px rgba(91,127,255,0.07), 0 1px 4px rgba(0,0,0,0.06);
  }

  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  h2 { font-size: 1.1rem; font-weight: 600; }
  p  { font-size: 0.9rem; line-height: 1.6; color: var(--muted); }

  .label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 8px; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost { background: #eef0f8; color: var(--text); }
  .btn-ghost:hover { background: #e2e5f2; }
  .btn-danger { background: var(--danger); color: #fff; width: 100%; margin-top: 8px; }

  .input {
    width: 100%; padding: 11px 14px; border-radius: 8px;
    background: #ffffff; border: 1px solid var(--border);
    color: var(--text); font-size: 0.95rem; outline: none;
    transition: border-color 0.15s;
  }
  .input:focus { border-color: var(--accent); }
  .input.error { border-color: var(--danger); }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .gap-4  { margin-top: 4px; }
  .gap-8  { margin-top: 8px; }
  .gap-12 { margin-top: 12px; }
  .gap-16 { margin-top: 16px; }
  .gap-20 { margin-top: 20px; }
  .gap-24 { margin-top: 24px; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #ffffff; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 18px; font-size: 0.85rem; font-weight: 500; z-index: 999;
    transition: transform 0.25s ease; color: var(--text);
    white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.danger { border-color: var(--danger); color: var(--danger); }

  #view-login .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; }
  #view-login .logo span { color: var(--accent); }
  #view-login .sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

  .progress-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
  .progress-step {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600; color: #b0b6d0;
    white-space: nowrap;
  }
  .progress-step.active { color: var(--accent); }
  .progress-step.done { color: var(--success); }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #dde1f0; border: 1.5px solid #c8cde6; flex-shrink: 0;
  }
  .progress-step.active .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .progress-step.done .dot { background: var(--success); border-color: var(--success); }
  .progress-line { flex: 1; height: 2px; background: #dde1f0; border-radius: 2px; min-width: 12px; }
  .progress-line.done { background: var(--success); }

  .criteria-header { background: var(--accent-dim); border: 1px solid rgba(91,127,255,0.2); border-radius: 10px; padding: 14px 16px; }
  .criteria-header .step-label { font-size: 0.72rem; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .criteria-header h2 { font-size: 1.05rem; }
  .criteria-header p { font-size: 0.82rem; margin-top: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 0.72rem; font-weight: 600; color: var(--accent); background: var(--accent-dim); padding: 3px 8px; border-radius: 20px; }

  .score-status {
    display: flex; align-items: center; justify-content: space-between;
    background: #f7f8fd; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px;
  }
  .score-status .remain-val { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
  .score-status .remain-val.warn { color: var(--danger); }
  .score-status .remain-val.ok { color: var(--success); }

  .member-row {
    display: flex; align-items: center;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; gap: 12px;
    transition: border-color 0.15s;
  }
  .member-row:hover { border-color: rgba(91,127,255,0.4); }
  .member-row.error-row { border-color: var(--danger); }
  .member-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(91,127,255,0.08); border: 1.5px solid rgba(91,127,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: var(--accent); flex-shrink: 0;
  }
  .member-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
  .score-input {
    width: 68px; padding: 9px 8px; border-radius: 6px; text-align: center;
    background: #f7f8fd; border: 1px solid var(--border);
    color: var(--text); font-size: 1rem; font-weight: 700; outline: none;
    transition: border-color 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }
  .score-input::-webkit-inner-spin-button,
  .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .score-input:focus { border-color: var(--accent); background: #ffffff; }
  .score-input.error { border-color: var(--danger); }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn-row .btn-primary { flex: 1; margin-top: 0; }

  .done-icon { font-size: 2.8rem; text-align: center; margin-bottom: 12px; }
  .summary-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .summary-item:last-child { border-bottom: none; }
  .summary-label { font-size: 0.85rem; color: var(--muted); }
  .summary-score { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
  .readonly-section { margin-top: 16px; }
  .readonly-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .readonly-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
  .readonly-row:last-child { border-bottom: none; }

  @media (max-width: 420px) {
    .card { padding: 24px 18px; }
    .score-input { width: 58px; font-size: 0.95rem; }
    .progress-step span { display: none; }
    .progress-step.active span { display: inline; }
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="card" id="view-login">
  <div class="logo">동료<span>평가</span></div>
  <div class="sub">2026 상반기 · 팀원 상호평가</div>
  <div class="divider"></div>
  <p style="font-size:0.875rem;color:var(--muted);margin-bottom:12px">평가자인 본인의 소속과 이름을 선택해주세요</p>
  <div class="label gap-8">이름 선택</div>
  <select class="input gap-4" id="login-group" onchange="onGroupChange()">
    <option value="">조 선택</option>
  </select>
  <select class="input gap-8" id="login-name">
    <option value="">이름 선택</option>
  </select>
  <button class="btn btn-primary gap-16" onclick="doLogin()">시작하기</button>
</div>

<div class="card" id="view-eval" style="display:none">
  <div class="progress-wrap" id="progress-bar"></div>
  <div class="criteria-header" id="criteria-header"></div>
  <div class="score-status gap-12">
    <div>
      <div class="label">남은 배분 가능 점수</div>
      <div class="remain-val" id="remain-val">100점</div>
    </div>
    <div style="text-align:right">
      <div class="label">총점</div>
      <div style="font-size:0.85rem;font-weight:600" id="total-val">0 / 100</div>
    </div>
  </div>
  <div id="member-list" style="display:flex;flex-direction:column;gap:8px;margin-top:12px"></div>
  <div class="btn-row" id="btn-row"></div>
</div>

<div class="card" id="view-done" style="display:none">
  <div class="done-icon">🎉</div>
  <h2 style="text-align:center">제출 완료!</h2>
  <p style="text-align:center;margin-top:6px">평가가 성공적으로 제출되었습니다.</p>
  <div id="done-summary" class="gap-24"></div>
</div>

<div class="card" id="view-readonly" style="display:none">
  <div class="label">이미 제출한 평가</div>
  <h2 class="gap-4" id="ro-title"></h2>
  <p class="gap-4" id="ro-sub"></p>
  <div id="ro-content" class="gap-16"></div>
  <button class="btn btn-danger gap-24" onclick="resetSubmit()">초기화하고 다시 제출</button>
</div>

<script>
const POWER_AUTOMATE_URL = "";

const MEMBERS = {
  "1조": ["구교선님","권성현님","박다운님","송하랑님","신채은님","조상형님","좌민경님"],
  "2조": ["권보민님","김승민님","박영준님","반진영님","윤주희님","이영훈님","정다일님","조승현님"],
  "3조": ["김민수님","김민아님","문재혁님","박도연님","박영서님","양승빈님","이창욱님","장진웅님"],
  "4조": ["권회준님","김민호님","김성범님","김성우님","김시원님","임나은님","정서현님","정소윤님"],
  "5조": ["강민주님","권민주님","김재원님","노영후님","손동혁님","송승호님","윤태혁님","황유빈님"],
  "6조": ["고정음님","도건우님","배재현님","이용현님","임세령님","전수빈님","최대현님","최민규님"],
  "7조": ["김민경님","김민우님","김태석님","이승찬님","천유동님","허준원님","황주희님"]
};

const CRITERIA = [
  { key:"score1", name:"내일 더 새롭게",
    desc:"호기심을 기반으로 트렌드를 읽고 혁신을 만들기 위해 끊임없이 새로운 것을 학습하고 제안한다.",
    tags:"#호기심 #학습민첩성 #변화주도 #창의적 사고" },
  { key:"score2", name:"꿈을 원대하게",
    desc:"글로벌을 기준으로 도전적 목표를 세우고 열정적으로 어려움을 헤쳐나간다.",
    tags:"#도전성 #성취지향 #거시적 사고 #자아효능감" },
  { key:"score3", name:"안돼도 다시",
    desc:"어려워도 긍정으로 버티고 겸허하게 다시 시도하며 실패를 교훈 삼아 다음에 더 나은 결과를 만든다.",
    tags:"#긍정성 #회복탄력성 #끈기" }
];

let state = { user:null, group:null, members:[], step:0, scores:{} };

(function init() {
  const g = document.getElementById('login-group');
  Object.keys(MEMBERS).forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = k; g.appendChild(o);
  });
  const saved = localStorage.getItem('peereval_submitted');
  if (saved) { try { showReadonly(JSON.parse(saved)); return; } catch(e) {} }
  const draft = localStorage.getItem('peereval_draft');
  if (draft) { try { state = JSON.parse(draft); startEval(); return; } catch(e) {} }
})();

function onGroupChange() {
  const g = document.getElementById('login-group').value;
  const s = document.getElementById('login-name');
  s.innerHTML = '<option value="">이름 선택</option>';
  if (g) (MEMBERS[g]||[]).forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n; s.appendChild(o);
  });
}

function doLogin() {
  const group = document.getElementById('login-group').value;
  const name  = document.getElementById('login-name').value;
  if (!group || !name) { showToast('조와 이름을 선택해주세요.', true); return; }
  if (!confirm(`${group} · ${name}\n\n이 이름으로 평가를 시작할까요?`)) return;
  state = { user:name, group, members:MEMBERS[group].filter(m=>m!==name), step:0, scores:{} };
  CRITERIA.forEach(c => { state.scores[c.key] = {}; });
  saveDraft(); startEval();
}

function startEval() { show('view-eval'); renderStep(); }

function renderStep() {
  const c = CRITERIA[state.step];
  document.getElementById('progress-bar').innerHTML = CRITERIA.map((cr,i) => {
    const cls = i < state.step ? 'done' : i === state.step ? 'active' : '';
    const line = i < CRITERIA.length-1 ? `<div class="progress-line${i<state.step?' done':''}"></div>` : '';
    return `<div class="progress-step ${cls}"><div class="dot"></div><span>${cr.name}</span></div>${line}`;
  }).join('');

  document.getElementById('criteria-header').innerHTML = `
    <div class="step-label">${state.step+1} / ${CRITERIA.length} 단계</div>
    <h2>${c.name}</h2><p>${c.desc}</p>
    <div class="tags">${c.tags.split('#').filter(Boolean).map(t=>`<span class="tag">#${t.trim()}</span>`).join('')}</div>`;

  document.getElementById('member-list').innerHTML = state.members.map(m => {
    const val = state.scores[c.key][m] !== undefined ? state.scores[c.key][m] : '';
    return `
      <div class="member-row" id="row-${eid(m)}">
        <div class="member-avatar">${m.replace('님','').slice(-2)}</div>
        <div class="member-name">${m}</div>
        <input class="score-input" type="number" inputmode="numeric" pattern="[0-9]*"
          placeholder="–" min="0" max="30" value="${val}" id="inp-${eid(m)}"
          oninput="onScore('${c.key}','${m}',this)" onkeydown="return fkey(event)">
      </div>`;
  }).join('');

  updateRemain();
  const isLast = state.step === CRITERIA.length-1;
  document.getElementById('btn-row').innerHTML =
    (state.step > 0 ? `<button class="btn btn-ghost" onclick="goPrev()">← 이전</button>` : '') +
    `<button class="btn btn-primary" style="margin-top:0" onclick="${isLast?'doSubmit()':'goNext()'}">
      ${isLast ? '제출하기 ✓' : '다음 →'}</button>`;
}

const eid = n => n.replace(/[^a-zA-Z0-9가-힣]/g,'_');

function fkey(e) {
  if (e.key==='Backspace'||e.key==='Delete'||e.key==='Tab'||e.key.startsWith('Arrow')||/^[0-9]$/.test(e.key)) return true;
  e.preventDefault(); return false;
}

function onScore(key, m, el) {
  let v = parseInt(el.value, 10);
  if (isNaN(v)||v<0) { el.value=''; delete state.scores[key][m]; }
  else { if(v>30){v=30;el.value=30;} state.scores[key][m]=v; }
  el.classList.remove('error');
  document.getElementById('row-'+eid(m))?.classList.remove('error-row');
  updateRemain(); saveDraft();
}

function updateRemain() {
  const scores = state.scores[CRITERIA[state.step].key];
  const total = state.members.reduce((s,m)=>s+(scores[m]||0),0);
  const remain = 100-total;
  const rv = document.getElementById('remain-val');
  rv.textContent = remain+'점';
  rv.className = 'remain-val'+(remain<0?' warn':remain===0?' ok':'');
  document.getElementById('total-val').textContent = total+' / 100';
}

function goNext() { if(!validateStep()) return; state.step++; saveDraft(); renderStep(); scrollTo(0,0); }
function goPrev() { state.step--; saveDraft(); renderStep(); scrollTo(0,0); }

function validateStep() {
  const scores = state.scores[CRITERIA[state.step].key];
  let hasEmpty=false, total=0;
  state.members.forEach(m => {
    const v = scores[m];
    if (v===undefined||v===null||v==='') {
      hasEmpty=true;
      document.getElementById('inp-'+eid(m))?.classList.add('error');
      document.getElementById('row-'+eid(m))?.classList.add('error-row');
    } else { total+=v; }
  });
  if (hasEmpty) { showToast('모든 팀원의 점수를 입력해주세요.', true); return false; }
  if (total>100) { showToast('총점이 100점을 초과합니다.', true); return false; }
  return true;
}

async function doSubmit() {
  if (!validateStep()) return;
  for (const c of CRITERIA) {
    const total = state.members.reduce((s,m)=>s+(state.scores[c.key][m]||0),0);
    if (total>100) { showToast(`[${c.name}] 총점 100점 초과`, true); state.step=CRITERIA.indexOf(c); renderStep(); return; }
  }
  if (!confirm('제출하면 수정이 불가합니다.\n최종 제출하시겠습니까?')) return;
  const payload = buildPayload();
  localStorage.setItem('peereval_submitted', JSON.stringify(payload));
  localStorage.removeItem('peereval_draft');
  if (POWER_AUTOMATE_URL) {
    try { await fetch(POWER_AUTOMATE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
    catch(e) { downloadCSV(payload); }
  } else { downloadCSV(payload); }
  showDone(payload);
}

function buildPayload() {
  const now = new Date().toISOString();
  return { evaluator:state.user, group:state.group, timestamp:now,
    rows: state.members.map(m=>({ evaluator:state.user, group:state.group, target:m,
      score1:state.scores.score1[m]||0, score2:state.scores.score2[m]||0, score3:state.scores.score3[m]||0, timestamp:now })) };
}

function downloadCSV(p) {
  const lines = ['evaluator,group,target,score1,score2,score3,timestamp',
    ...p.rows.map(r=>`${r.evaluator},${r.group},${r.target},${r.score1},${r.score2},${r.score3},${r.timestamp}`)];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv'}));
  a.download = `peer-eval-${state.user}-${Date.now()}.csv`; a.click();
}

function showDone(payload) {
  show('view-done');
  document.getElementById('done-summary').innerHTML = CRITERIA.map(c=>
    `<div class="summary-item">
      <span class="summary-label">${c.name}</span>
      <span class="summary-score">${payload.rows.reduce((s,r)=>s+r[c.key],0)}점 배분</span>
    </div>`).join('');
}

function showReadonly(data) {
  show('view-readonly');
  document.getElementById('ro-title').textContent = data.evaluator+'의 제출 내역';
  document.getElementById('ro-sub').textContent = data.group+' · '+new Date(data.timestamp).toLocaleString('ko-KR');
  document.getElementById('ro-content').innerHTML = CRITERIA.map(c=>
    `<div class="readonly-section"><div class="readonly-title">${c.name}</div>
      ${(data.rows||[]).map(r=>`<div class="readonly-row"><span>${r.target}</span>
        <span style="color:var(--accent);font-weight:700">${r[c.key]}점</span></div>`).join('')}
    </div>`).join('');
}

function resetSubmit() {
  if (!confirm('제출 내역을 초기화하고 다시 평가하시겠습니까?')) return;
  localStorage.removeItem('peereval_submitted');
  localStorage.removeItem('peereval_draft');
  location.reload();
}

function show(id) {
  ['view-login','view-eval','view-done','view-readonly'].forEach(v=>
    document.getElementById(v).style.display = v===id?'block':'none');
}

function saveDraft() { localStorage.setItem('peereval_draft', JSON.stringify(state)); }

let toastTimer;
function showToast(msg, isDanger) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast'+(isDanger?' danger':'');
  clearTimeout(toastTimer);
  requestAnimationFrame(()=>{ el.classList.add('show'); toastTimer=setTimeout(()=>el.classList.remove('show'),2800); });
}
</script>
</body>
</html>
